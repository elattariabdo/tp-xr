
<!-- ============ BLOC 1 : ENVIRONNEMENT ============ -->

<a-entity id="Environnement">

    <a-sky color="#9ec9ee"></a-sky>

    <a-entity light="type: ambient; intensity: 0.7"></a-entity>

    <a-entity
        light="type: directional; intensity: 0.8"
        position="1 4 2">
    </a-entity>

    <!-- Sol -->
    <a-plane
        id="Sol"
        class="interactif"
        teleport-sol
        rotation="-90 0 0"
        width="6"
        height="6"
        material="color: #c9c9c9; roughness: 0.9">
    </a-plane>

    <!-- Murs -->
    <a-plane position="0 1.5 -3" width="6" height="3"
        material="color: #e8eef5"></a-plane>

    <a-plane position="-3 1.5 0" rotation="0 90 0"
        width="6" height="3"
        material="color: #e8eef5"></a-plane>

    <a-plane position="3 1.5 0" rotation="0 -90 0"
        width="6" height="3"
        material="color: #e8eef5"></a-plane>

    <a-plane position="0 1.5 3" rotation="0 180 0"
        width="6" height="3"
        material="color: #e8eef5"></a-plane>

    <!-- Table A : instruments -->
    <a-entity id="Table_A" position="-0.6 0 -1">

        <a-box position="0 0.725 0"
            width="1" height="0.05" depth="0.6"
            material="color: #8d6e63; roughness: 0.8">
        </a-box>

        <a-box position="-0.45 0.35 -0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#5d4037"></a-box>

        <a-box position="0.45 0.35 -0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#5d4037"></a-box>

        <a-box position="-0.45 0.35 0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#5d4037"></a-box>

        <a-box position="0.45 0.35 0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#5d4037"></a-box>

    </a-entity>

    <!-- Table B : zones de dépôt -->
    <a-entity id="Table_B" position="0.6 0 -1">

        <a-box position="0 0.725 0"
            width="1" height="0.05" depth="0.6"
            material="color: #eceff1; roughness: 0.5">
        </a-box>

        <a-box position="-0.45 0.35 -0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#90a4ae"></a-box>

        <a-box position="0.45 0.35 -0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#90a4ae"></a-box>

        <a-box position="-0.45 0.35 0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#90a4ae"></a-box>

        <a-box position="0.45 0.35 0.25"
            width="0.05" height="0.7" depth="0.05"
            color="#90a4ae"></a-box>

    </a-entity>

    <!-- Panneau de mission -->
    <a-plane
        position="0 2.0 -2.95"
        width="2.4"
        height="0.9"
        material="color: #1b2a41; shader: flat">
    </a-plane>

    <a-text
        id="Panneau"
        position="0 2.0 -2.93"
        width="2.2"
        align="center"
        color="#ffffff"
        value="Salle de formation\nPlacez chaque instrument\ndans sa zone.">
    </a-text>

    <a-text
        position="0 2.55 -2.93"
        width="2.2"
        align="center"
        color="#ffd54f"
        value="Prototype pédagogique - pas un dispositif médical">
    </a-text>

</a-entity>


<!-- ============ BLOC 4 : XR ORIGIN + CAMÉRA + CURSEUR ============ -->

<!-- On déplace le RIG, jamais la caméra seule -->

<a-entity
    id="rig"
    position="0 0 0.8"
    wasd-controls="acceleration: 15">

    <a-entity
        id="tete"
        camera
        position="0 1.6 0"
        look-controls>

        <a-entity
            id="curseur"
            cursor="fuse: false"
            raycaster="objects: .interactif; far: 8"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
            material="color: #ffffff; shader: flat; opacity: 0.9">
        </a-entity>

    </a-entity>

</a-entity>
