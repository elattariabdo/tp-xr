
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>TP2 - Salle XR interactive</title>

    <!-- Bibliothèque A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe-v1.7.1.min.js"></script>

    <style>
        body {
            margin: 0;
        }

        #hud {
            position: fixed;
            bottom: 8px;
            left: 8px;
            right: 8px;
            z-index: 10;
            pointer-events: none;
            font: 600 16px system-ui, sans-serif;
            color: #fff;
            text-shadow: 0 0 4px #000, 0 0 4px #000;
        }
    </style>
</head>

<body>

    <div id="hud">
        Visez avec le point blanc, touchez l'écran pour agir.
    </div>

    <a-scene id="scene" vr-mode-ui="enabled: false"
             renderer="antialias: true">

        <!-- Sol -->
        <a-plane
            position="0 0 -4"
            rotation="-90 0 0"
            width="20"
            height="20"
            color="#808080">
        </a-plane>

        <!-- Ciel -->
        <a-sky color="#9ec9ee"></a-sky>

        <!-- Objets interactifs -->
        <a-box
            id="boite"
            position="0 1.2 -3"
            color="#e53935"
            class="interactif">
        </a-box>

        <a-sphere
            id="sphere"
            position="2 1.2 -3"
            radius="0.6"
            color="#2196f3"
            class="interactif">
        </a-sphere>

        <a-cylinder
            id="cylindre"
            position="-2 1.2 -3"
            radius="0.5"
            height="1.2"
            color="#4caf50"
            class="interactif">
        </a-cylinder>

        <!-- Caméra et curseur -->
        <a-entity position="0 1.6 0">

            <a-camera>
                <a-cursor
                    color="white"
                    fuse="false"
                    raycaster="objects: .interactif">
                </a-cursor>
            </a-camera>

        </a-entity>

    </a-scene>

    <script>

        // Récupération des objets
        const objets = document.querySelectorAll(".interactif");

        // Interaction avec les objets
        objets.forEach(function(objet) {

            // Changer la couleur au survol
            objet.addEventListener("mouseenter", function() {
                objet.setAttribute("scale", "1.2 1.2 1.2");
            });

            // Restaurer la taille
            objet.addEventListener("mouseleave", function() {
                objet.setAttribute("scale", "1 1 1");
            });

            // Changer la couleur au clic
            objet.addEventListener("click", function() {

                const couleur = objet.getAttribute("color");

                if (couleur === "#e53935") {
                    objet.setAttribute("color", "#ffeb3b");
                }
                else if (couleur === "#2196f3") {
                    objet.setAttribute("color", "#ff9800");
                }
                else {
                    objet.setAttribute("color", "#9c27b0");
                }

            });

        });

    </script>

</body>
</html>
